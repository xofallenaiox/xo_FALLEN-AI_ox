services:
  - type: web
    name: fallen-cloud
    runtime: python
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: fallen-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: FALLEN_DATA_DIR
        value: "/var/data"
      - key: FALLEN_API_TOKEN
        generateValue: true
      - key: FALLEN_SESSION_SECRET
        generateValue: true
      - key: FALLEN_AGENT_ENROLLMENT_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-5.6"
      - key: FALLEN_ALLOWED_HOSTS
        sync: false
      - key: FALLEN_ALLOWED_ORIGINS
        sync: false
      - key: FALLEN_COOKIE_SECURE
        value: "true"

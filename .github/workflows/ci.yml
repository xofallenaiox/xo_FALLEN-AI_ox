name: FALLEN AI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# CI should never need write access to the repository.
permissions:
  contents: read

# Cancel an older run when a newer commit is pushed.
concurrency:
  group: fallen-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  FALLEN_ENV: ci
  FALLEN_VOICE_ENABLED: "false"
  OPENAI_API_KEY: "ci-test-key"
  FALLEN_API_TOKEN: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
  FALLEN_SESSION_SECRET: "CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC"
  FALLEN_AGENT_ENROLLMENT_TOKEN: "BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB"

jobs:

  # ---------------------------------------------------------
  # Python syntax + lint
  # ---------------------------------------------------------
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff pytest

      - name: Python syntax check
        run: |
          python -m compileall -q backend tests
          
      - name: Ruff safety lint
        run: |
          python -m ruff check --select F,E9 backend tests

      - name: Run Python tests
        run: |
          python -m pytest -q tests


  # ---------------------------------------------------------
  # Backend import + safety smoke tests
  # ---------------------------------------------------------
  backend-smoke:
    name: Backend smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Import backend
        run: |
          python - <<'PY'
          from backend.main import app
          print("FALLEN backend import: OK")
          print(f"Routes: {len(app.routes)}")
          PY

      - name: Validate API routes and permissions
        run: |
          python - <<'PY'
          from backend.main import app
          from backend.permissions import get_tool_policy

          routes = {route.path for route in app.routes}

          required_routes = {
              "/health",
              "/permissions",
              "/chat",
              "/auth/session",
              "/agents/register",
              "/agents/poll",
              "/agents/result",
          }

          missing = required_routes - routes
          assert not missing, f"Missing required routes: {sorted(missing)}"

          read_policy = get_tool_policy("windows_read_text")
          assert read_policy is not None
          assert read_policy.risk == "medium"
          assert read_policy.requires_confirmation is True

          for tool_name in ("windows_open_app", "windows_speak"):
              policy = get_tool_policy(tool_name)
              assert policy is not None
              assert policy.risk == "low"
              assert policy.requires_confirmation is False

          assert get_tool_policy("powershell_exec") is None

          print("FALLEN backend safety checks: OK")
          PY


  # ---------------------------------------------------------
  # Frontend validation
  # ---------------------------------------------------------
  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
            
      - name: Validate required frontend files
        run: |
          test -f frontend/index.html
          test -f frontend/styles.css
          test -f frontend/app.js

      - name: JavaScript syntax check
        run: |
          node --check frontend/app.js

      - name: Validate HTML assets
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class AssetParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.assets = set()

              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)

                  if tag == "link":
                      if attributes.get("rel") == "stylesheet":
                          href = attributes.get("href")
                          if href:
                              self.assets.add(href)

                  if tag == "script":
                      src = attributes.get("src")
                      if src:
                          self.assets.add(src)

          html = Path("frontend/index.html").read_text(
              encoding="utf-8"
          )

          parser = AssetParser()
          parser.feed(html)

          required = {
              "styles.css",
              "app.js",
          }

          missing = required - parser.assets

          assert not missing, (
              f"Missing frontend assets: {sorted(missing)}"
          )

          print("FALLEN frontend asset validation: OK")
          PY


  # ---------------------------------------------------------
  # Security-oriented repository checks
  # ---------------------------------------------------------
  repository-safety:
    name: Repository safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for accidentally committed secrets
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking repository for obvious credential patterns..."

          if grep -RInE \
            --exclude-dir=.git \
            --exclude='ci.yml' \
            --exclude='security.yml' \
            '(sk-[A-Za-z0-9]{20,}|OPENAI_API_KEY[[:space:]]*=[[:space:]]*[^$"{[:space:]]+|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY)' \
            .; then

            echo "::error::Possible secret detected in repository."
            exit 1
          fi

          echo "Repository secret pattern check: OK"

      - name: Check for forbidden local credential files
        run: |
          forbidden=(
            ".env"
            ".env.local"
            ".env.production"
            "credentials.json"
            "service-account.json"
          )

          for file in "${forbidden[@]}"; do
            if [ -f "$file" ]; then
              echo "::error::Forbidden credential file detected: $file"
              exit 1
            fi
          done

          echo "Credential-file check: OK"


  # ---------------------------------------------------------
  # Final CI gate
  # ---------------------------------------------------------
  ci-gate:
    name: FALLEN CI gate
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - backend-smoke
      - frontend
      - repository-safety

    steps:
      - name: CI passed
        run: |
          echo "======================================"
          echo " FALLEN AI CI PASSED"
          echo "======================================"
          echo "Backend quality: PASS"
          echo "Backend smoke:   PASS"
          echo "Frontend:        PASS"
          echo "Repository safe: PASS"
